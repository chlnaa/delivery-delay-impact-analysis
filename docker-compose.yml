services:
  db:
    image: postgres:15
    container_name: analysis_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - analysis_db_data:/var/lib/postgresql/data

volumes:
  analysis_db_data:
